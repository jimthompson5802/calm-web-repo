[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project]
name = "pyweb"
version = "0.1.0"
description = "Simple stdlib static file server for calm-web-repo."
readme = "README.md"
requires-python = ">=3.12"

[project.scripts]
pyweb = "pyweb.__main__:main"

[dependency-groups]
dev = [
  "mypy>=1.17,<1.18",
  "pytest>=8.4,<8.5",
  "ruff>=0.12,<0.13",
]

[tool.hatch.build.targets.wheel]
packages = ["src/pyweb"]

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["pyweb"]
